<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Little Finds Studio — Curated Little Finds</title>
<meta name="description" content="A curated Pinterest-style journal of cozy study, stationery, decor and gift finds.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#faf6ee; --paper:#fffdf8; --sage:#8a9a7e; --blush:#e8c4c4; --lav:#c9bfdc; --butter:#f0d98c;
  --ink:#2f3d2a; --muted:#7c7566; --line:#e9e0cf;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Poppins',sans-serif;font-weight:300;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3{font-family:'Playfair Display',serif;margin:0;}
a{color:inherit;}
.strip{background:var(--sage);color:#fff;text-align:center;font-size:.75rem;letter-spacing:.06em;
  padding:.5rem 1rem; padding-top:calc(.5rem + env(safe-area-inset-top,0px));}
header{position:sticky;top:0;background:var(--ivory);z-index:5;border-bottom:1px solid var(--line);
  padding:1rem 1.2rem;}
.header-row{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;}
.brand{font-size:1.4rem;color:var(--sage);}
.brand span{font-style:italic;font-size:.95rem;color:var(--muted);display:block;font-family:'Poppins';}
nav{display:flex;gap:1.3rem;font-size:.8rem;letter-spacing:.04em;}
nav a{text-decoration:none;color:var(--ink);}
.hero{max-width:900px;margin:3rem auto 2rem;text-align:center;padding:0 1.3rem;}
.hero h2{font-size:2.1rem;font-weight:600;line-height:1.3;}
.hero p{color:var(--muted);font-size:.95rem;margin:1rem auto 1.5rem;max-width:480px;}
.cta{display:inline-block;background:var(--sage);color:#fff;padding:.7rem 1.6rem;border-radius:30px;
  text-decoration:none;font-size:.85rem;margin:.3rem;}
.cta.alt{background:transparent;border:1px solid var(--sage);color:var(--sage);}
.collage{display:flex;gap:.8rem;overflow-x:auto;padding:1rem 1.3rem 2.5rem;scroll-snap-type:x mandatory;}
